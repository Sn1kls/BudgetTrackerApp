version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: budget_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: budget_ngrok
    command: "http web:8000"
    ports:
      - "4040:4040"
    env_file:
      - .env

volumes:
  postgres_data:

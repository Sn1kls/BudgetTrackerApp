[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Budget Tracker Backend"
authors = ["Snikls <macks.chigrin@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2"
djangorestframework = "^3.16"
psycopg2-binary = "^2.9"
python-dotenv = "^1.0.1"
djangorestframework-simplejwt = "^5.5.0"
drf-yasg = "^1.21.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.1,<9.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "pytest-cov (>=6.2.1,<7.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.ruff]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["RUF012"]  # Django Meta/DRF class attributes are lists by convention

[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Budget Tracker Backend"
authors = ["Snikls <macks.chigrin@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2"
djangorestframework = "^3.16"
psycopg2-binary = "^2.9"
python-dotenv = "^1.0.1"
djangorestframework-simplejwt = "^5.5.0"
drf-yasg = "^1.21.10"
pytest = "^8.4.1"
